# Publishes to npm when a version tag (v1.2.3) is pushed. Uses npm trusted publishing:
# on npmjs.com, add this repository and workflow under the package's Trusted Publisher
# settings; no token is stored here.
name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm publish --provenance --access public
